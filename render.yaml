# Render Blueprint — one-click free deploy of HR-OS (single service).
#
# Spins up TWO free resources:
#   • hr-os-db   — managed PostgreSQL (free)
#   • hrms-ez    — FastAPI backend that ALSO serves the React admin UI + public careers
#                 pages + job feeds (Docker, free). One service, one URL (hrms-ez.onrender.com),
#                 same origin — no separate static host, no VITE_API_BASE to wire.
#
# NOTE: the web service is named `hrms-ez` → URL https://hrms-ez.onrender.com. Render can't
# rename an existing service's URL, so re-syncing this Blueprint creates a NEW service
# `hrms-ez`; afterwards DELETE the old `hr-os-backend` (and the unused `hr-os-frontend`)
# in the dashboard. You'll re-enter the `sync: false` env values on the new service.
#
# Deploy:
#   1. Push this repo to GitHub.
#   2. render.com → New → Blueprint → connect this repo (or re-sync the existing one).
#   3. Paste the "sync: false" values it prompts for (AI key + company name are the only
#      ones you need to start; email + direct-posting creds are optional, add later).
#   4. Open the service URL: the admin UI is at /, the API at /api, careers at /careers.
#      PUBLIC_BASE_URL auto-resolves to this URL, so job feeds and the Google Indexing
#      push work immediately. Submit /careers/sitemap.xml + /careers/feed.xml to the free
#      aggregators (see the Distribution page).
#
# Free tier: services sleep after ~15 min idle (≈50s cold start) and free Postgres is
# removed after ~30 days — fine for testing. Upgrade to paid ($7/mo) for always-on.

databases:
  - name: hr-os-db
    plan: free
    databaseName: hros
    user: hros

services:
  - type: web
    name: hrms-ez           # → https://hrms-ez.onrender.com
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .            # repo root so the image can build the frontend too
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: hr-os-db
          property: connectionString
      # ── Auth ── Render generates a strong secret for signing session tokens.
      - key: SECRET_KEY
        generateValue: true
      # First-run bootstrap admin (you log in with these, then add users in Settings).
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: AI_PROVIDER
        value: auto
      # ── FREE AI: Google Gemini (key from https://aistudio.google.com/apikey) ──
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai
      - key: OPENAI_MODEL
        value: gemini-2.5-flash
      - key: OPENAI_JSON_MODE
        value: "false"
      - key: EMBEDDINGS_PROVIDER
        value: hash
      # ── Company identity (careers pages + emails) ──
      - key: COMPANY_NAME
        sync: false
      - key: COMPANY_WEBSITE
        sync: false
      - key: COMPANY_COUNTRY
        value: India
      - key: EMAIL_FROM
        sync: false
      - key: EMAIL_FROM_NAME
        sync: false
      # PUBLIC_BASE_URL auto-resolves from Render's RENDER_EXTERNAL_URL — leave unset.
      # ── Optional: real email (Gmail/Workspace SMTP or any provider) ──
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      # ── Optional: automated direct posting ──
      - key: GOOGLE_INDEXING_SA_JSON   # Google for Jobs — service-account JSON (inline)
        sync: false
      - key: LINKEDIN_ACCESS_TOKEN     # LinkedIn company-page auto-share
        sync: false
      - key: LINKEDIN_ORG_URN
        sync: false
